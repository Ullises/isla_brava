# docker-compose.db.yml (o tu archivo actual)
version: '3.8'
services:
  db-islabrava:
    image: mysql:8
    env_file:
      - .env
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - islabrava-net

  adminer-islabrava-db:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - islabrava-net

volumes:
  mysql_data:

networks:
  islabrava-net:
    name: islabrava-net
    driver: bridge