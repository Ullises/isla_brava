services:
  db-islabrava:
    image: postgres:16
    container_name: islabrava-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - islabrava-net

  backend:
    build:
      dockerfile: dockerfile
    container_name: islabrava-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db-islabrava
    depends_on:
      - db-islabrava
    ports:
      - "5010:5010"
    networks:
      - islabrava-net

  adminer:
    image: adminer
    container_name: islabrava-adminer
    restart: unless-stopped
    depends_on:
      - db-islabrava
    ports:
      - "8081:8080"
    networks:
      - islabrava-net

volumes:
  postgres_data:

networks:
  islabrava-net:
    driver: bridge